# Alembic config (docs/09 P0-3).
#
# NOTE: alembic reads this file with the *system locale* encoding, so it must stay
# ASCII-only. On a zh-CN Windows box the locale is GBK and any CJK comment here makes
# `alembic` die with UnicodeDecodeError before it even starts. Keep it English.
#
# The database URL is NOT configured here on purpose: it comes from
# recipe_planner.infra.settings.database_url() -- the same source the app and the
# repositories use (env var DATABASE_URL, default data/app.db).
# Point a command at another database with:
#   alembic -x url=sqlite+aiosqlite:///D:/cook/recipe-planner/.tmp/x.db upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

# Local timezone for migration timestamps (default UTC would date commits as yesterday).
timezone = Asia/Shanghai

# Intentionally empty: see _database_url() in alembic/env.py
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
